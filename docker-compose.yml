services:
  # Define the PostgreSQL database service
  db:
    image: postgres:17 # Use a specific, recent version of Postgres
    container_name: railway-postgres
    restart: always
    environment:
      POSTGRES_DB: ryzera-railway-parcel-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      # Map the container's port 5432 to your local machine's port 5433
      - "5433:5432"
    volumes:
      # This persists the database data on your local machine
      - db-data:/var/lib/postgresql/data

  # Define the Spring Boot backend service
  backend:
    container_name: railway-backend
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ryzera-railway-parcel-db
      SPRING_DATASOURCE_USERNAME: postgres
      # --- THIS IS THE CRITICAL FIX ---
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      - db

# Define a named volume for our database data to persist
volumes:
  db-data: